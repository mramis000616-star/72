<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mod-72 Maximally Even Circle</title>
<style>
  :root{
    --bg:#11131a; --panel:#1b1e29; --ink:#e8ebf2; --muted:#8b93a7;
    --line:#2c3142; --accent:#5dd6c4; --accent2:#f0a35e; --sel:#ffd04d;
    --match:#9b8cff; --onset:#5dd6c4; --bold:#e8ebf2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.45 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .wrap{display:flex;gap:20px;padding:20px;flex-wrap:wrap;align-items:flex-start}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
  .side{flex:1;min-width:280px;max-width:440px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 14px}
  .group{margin-bottom:16px}
  .group h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;
            color:var(--muted);margin:0 0 8px}
  .btns{display:flex;flex-wrap:wrap;gap:8px}
  button{font:inherit;color:var(--ink);background:#222636;border:1px solid var(--line);
         border-radius:9px;padding:8px 12px;cursor:pointer;transition:.12s}
  button:hover{border-color:#445;background:#272c40}
  button.mode.active{background:var(--accent);color:#06221d;border-color:var(--accent);font-weight:700}
  button.pat{min-width:46px;font-weight:600}
  button.pat.active{background:var(--accent2);color:#3a1c00;border-color:var(--accent2)}
  button.pat.match{border-color:var(--match);box-shadow:0 0 0 2px rgba(155,140,255,.45);color:#cfc7ff}
  button:disabled{opacity:.35;cursor:default}
  button:disabled:hover{border-color:var(--line);background:#222636}
  button.ghost{background:transparent}
  .info{background:#0f1117;border:1px solid var(--line);border-radius:10px;
        padding:12px;font-size:13px;min-height:90px}
  .info b{color:var(--accent)}
  .info .tag{display:inline-block;background:#222636;border:1px solid var(--line);
             border-radius:6px;padding:1px 7px;margin:2px 4px 2px 0;font-size:12px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:8px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px}
  svg{display:block}
  .pt{cursor:default}
  .pt.clickable{cursor:pointer}
  text{font:11px system-ui;fill:var(--muted);user-select:none}
  text.bold{fill:var(--ink);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <svg id="circle" width="600" height="600" viewBox="0 0 600 600"></svg>
    <div class="legend">
      <span><i style="background:var(--bold)"></i>bold note (mult. of 6)</span>
      <span><i style="background:var(--sel)"></i>selected key / center</span>
      <span><i style="background:transparent;border:2px solid var(--onset)"></i>pattern onset</span>
      <span><i style="background:var(--match)"></i>interval endpoint</span>
      <span><i style="background:var(--accent2)"></i>target center (scale mode)</span>
    </div>
  </div>

  <div class="side">
    <h1>Mod-72 Maximally Even Circle</h1>
    <p class="sub">72 points · 12 bold notes at multiples of 6 · symmetric ME patterns</p>

    <div class="group">
      <h2>Modes</h2>
      <div class="btns">
        <button class="mode" id="mKey">Change Key</button>
        <button class="mode" id="mInterval">Interval Mode</button>
        <button class="mode" id="mScale">Scale Mode</button>
      </div>
    </div>

    <div class="group">
      <h2>Patterns (onsets)</h2>
      <div class="btns" id="patBtns"></div>
    </div>

    <div class="group">
      <h2>State</h2>
      <div class="info" id="info"></div>
    </div>

    <div class="group">
      <button class="ghost" id="clearBtn">Clear selection</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ----------------------------------------------------------------------------
   MODEL
   - N = 72 points on a circle, index 0..71, point 0 at top, clockwise = +.
   - Bold / selectable notes: multiples of 6  -> {0,6,...,66}  (12 notes).
   - Patterns: maximally even sets with an odd onset count k, generated as a
     symmetric chain of a generating interval g (mod 72) about a CENTER OF
     SYMMETRY (an onset that sits on the selected bold note).
       pos(i) = ( center + dir * i * g )  mod 72 ,   i = -m .. m,  m=(k-1)/2
     dir encodes the generation direction:
       dir = -1  -> "first generator counter-clockwise" : patterns 5,17,29
       dir = +1  -> "first generator clockwise"          : patterns 7,19,31
     (The dot SET is symmetric either way; dir fixes which physical onset is the
      +1-generator onset, which is what makes cross-pattern interval matching
      direction-aware.)
   - Generation order alternates outward from the center: chain index +1 is
     placed by alternating step 1, -1 by step 2, +2 by step 3, ... i.e.
       s(i) = i>0 ? 2i-1 : -2i.
     An interval between chain indices iA,iB is created at alternating step
     max(s(iA), s(iB)). The FIRST instance of an interval spanning n = |iA-iB|
     indices is the pair straddling the center, created at alternating step n;
     it counts as STEP 1. The step count of any interval is therefore the
     number of alternating steps since that first instance (inclusive):
       step(iA,iB) = max(s(iA), s(iB)) - |iA-iB| + 1.
   - Interval matching: another pattern T (centered at some bold note C')
     matches when both endpoints are onsets of T at their SAME ABSOLUTE
     positions and T creates the interval in the SAME number of steps.
     Pressing a matched button keeps the interval and moves the key to C'.
     (Each matching pattern has exactly one such C'; a pattern never matches
     itself at another key, since equal g and steps force an equal center.)
   -------------------------------------------------------------------------- */
const N = 72;
const PATTERNS = {            // k : {g, dir}
  5 : {g:29, dir:-1},
  7 : {g:31, dir:+1},
  17: {g:17, dir:-1},
  19: {g:19, dir:+1},
  29: {g:5 , dir:-1},
  31: {g:7 , dir:+1},
};
const PATTERN_KEYS = [5,7,17,19,29,31];

/* ---- state ---- */
let mode = "key";            // "key" | "interval" | "scale" | null
let selectedKey = 0;         // center of symmetry (a multiple of 6)
let activePattern = 5;       // currently displayed pattern (a key of PATTERNS) or null
let intervalSel = [];        // up to two onset positions selected (interval mode)
let scaleRoot = null;        // target CENTER note chosen in scale mode (any bold note)
let scaleTarget = null;      // target pattern chosen in scale mode
let matchInfo = new Map();   // pattern key -> target center (key) for the match
let currentSteps = null;     // generation steps of the selected interval

const mod = x => ((x % N) + N) % N;
const modInverse = {};       // g -> g^-1 mod 72 (all generators are coprime to 72)
for(const k of [5,7,17,19,29,31]){
  const g = PATTERNS[k].g;
  for(let x=1;x<N;x++) if(mod(g*x)===1){ modInverse[g]=x; break; }
}

/* Alternating step that places chain index i (+1 first, -1 second, ...). */
const altStep = i => i>0 ? 2*i-1 : -2*i;
/* Step count of an interval: alternating steps since the first instance of
   its size (the center-straddling pair, created at step n), inclusive. */
const stepOf = (iA,iB) =>
  Math.max(altStep(iA), altStep(iB)) - Math.abs(iA-iB) + 1;

/* Chain index of absolute position pos in pattern T centered at C, or null. */
function idxOf(pos, T, C){
  const {g,dir} = PATTERNS[T];
  let i = mod(dir * modInverse[g] * (pos - C));
  if(i > N/2) i -= N;
  return Math.abs(i) <= (T-1)/2 ? i : null;
}

/* Generate the onsets of pattern p centered at C. Returns [{i,pos}]. */
function onsetsOf(p, C){
  const {g,dir} = PATTERNS[p];
  const k = p, m = (k-1)/2, out = [];
  for(let i=-m;i<=m;i++) out.push({i, pos: mod(C + dir*i*g)});
  return out;
}
/* Matches for the interval (posA,posB) of pattern P centered at C.
   Returns {steps, map} where map is patternKey -> matching center C'.
   A pattern T matches at center C' (a bold note) when both endpoints are
   onsets of T at the same absolute positions and the interval has the same
   step count (alternating steps since the first instance of its size). */
function matchesForInterval(posA, posB, P, C){
  const iA = idxOf(posA,P,C), iB = idxOf(posB,P,C);
  if(iA===null || iB===null || iA===iB) return {steps:null, map:new Map()};
  const steps = stepOf(iA,iB);
  const map = new Map();
  for(const T of PATTERN_KEYS){
    if(T === P) continue;
    for(let Cp=0; Cp<N; Cp+=6){
      const jA = idxOf(posA,T,Cp), jB = idxOf(posB,T,Cp);
      if(jA===null || jB===null || jA===jB) continue;
      if(stepOf(jA,jB) === steps){ map.set(T,Cp); break; }
    }
  }
  return {steps, map};
}

/* ---------------------------------------------------------------- geometry */
const cx=300, cy=300, R=242;
function xy(idx){
  const t = (idx/N)*2*Math.PI - Math.PI/2;     // 0 at top, clockwise
  return [cx + R*Math.cos(t), cy + R*Math.sin(t)];
}
const svg = document.getElementById("circle");
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs){
  const e = document.createElementNS(SVGNS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* ----------------------------------------------------------------- render */
function render(){
  svg.innerHTML = "";
  const onsets = activePattern!=null ? onsetsOf(activePattern, selectedKey) : [];
  const onsetPos = new Set(onsets.map(o=>o.pos));

  // guide circle
  svg.appendChild(el("circle",{cx,cy,r:R,fill:"none",stroke:"#2c3142","stroke-width":1}));

  // dotted interval line
  if(intervalSel.length===2){
    const [a,b] = intervalSel.map(xy);
    svg.appendChild(el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],
      stroke:"#9b8cff","stroke-width":2.5,"stroke-dasharray":"3 6","stroke-linecap":"round"}));
  }

  // onset rings
  for(const o of onsets){
    const [x,y] = xy(o.pos);
    svg.appendChild(el("circle",{cx:x,cy:y,r:13,fill:"none",
      stroke: o.i===0 ? "#ffd04d" : "#5dd6c4","stroke-width": o.i===0?2.5:2}));
  }

  // points
  for(let idx=0; idx<N; idx++){
    const [x,y] = xy(idx);
    const isBold = idx % 6 === 0;
    const isKey  = idx === selectedKey;
    const isSel  = intervalSel.includes(idx);
    const isOnset= onsetPos.has(idx);

    const isRoot = mode==="scale" && idx===scaleRoot;
    let fill = isBold ? "#e8ebf2" : "#4a5167";
    let r = isBold ? 6.5 : 3.2;
    if(isSel){ fill = "#9b8cff"; r = 7.5; }
    else if(isRoot){ fill = "#f0a35e"; r = 8; }
    else if(isKey){ fill = "#ffd04d"; r = 8; }

    const clickable =
      (mode==="key"      && isBold) ||
      (mode==="interval" && isOnset) ||
      (mode==="scale"    && isBold);

    const c = el("circle",{cx:x,cy:y,r,fill,
      class:"pt"+(clickable?" clickable":"")});
    if(clickable){ c.style.cursor="pointer"; c.addEventListener("click",()=>onPoint(idx)); }
    svg.appendChild(c);

    // label every bold note with its index
    if(isBold){
      const [lx,ly] = (()=>{const t=(idx/N)*2*Math.PI-Math.PI/2;
        return [cx+(R+20)*Math.cos(t), cy+(R+20)*Math.sin(t)+4];})();
      const tx = el("text",{x:lx,y:ly,"text-anchor":"middle",class:"bold"});
      tx.textContent = idx;
      svg.appendChild(tx);
    }
  }

  updateButtons();
  updateInfo();
}

/* --------------------------------------------------------------- controls */
function setMode(m){
  mode = (mode===m) ? null : m;     // toggling an active mode turns it off
  // switching modes clears transient selections
  intervalSel = [];
  scaleRoot = null; scaleTarget = null;
  matchInfo = new Map(); currentSteps = null;
  render();
}

function onPoint(idx){
  if(mode==="key"){
    if(idx % 6 === 0){ selectedKey = idx; render(); }
    return;
  }
  if(mode==="interval"){
    if(activePattern==null) return;
    const i = intervalSel.indexOf(idx);
    if(i>=0) intervalSel.splice(i,1);
    else { intervalSel.push(idx); if(intervalSel.length>2) intervalSel.shift(); }
    recomputeMatches();
    render();
    return;
  }
  if(mode==="scale"){
    if(idx % 6 === 0){ scaleRoot = idx; tryScaleSelect(); render(); }
    return;
  }
}

function recomputeMatches(){
  matchInfo = new Map(); currentSteps = null;
  if(intervalSel.length===2 && activePattern!=null){
    const r = matchesForInterval(intervalSel[0], intervalSel[1],
                                 activePattern, selectedKey);
    matchInfo = r.map; currentSteps = r.steps;
  }
}

/* Scale mode: given a TARGET CENTER note (any bold note, need not belong to
   the active pattern) and a target pattern, find the interval within the
   ACTIVE pattern that would lead to that pattern centered on that note in
   interval mode, and select those two points. Prefers the fewest steps. */
function tryScaleSelect(){
  intervalSel = []; matchInfo = new Map(); currentSteps = null;
  if(scaleRoot==null || scaleTarget==null || activePattern==null) return;
  if(scaleTarget===activePattern) return;   // never reachable (same g+steps => same center)
  const onsets = onsetsOf(activePattern, selectedKey);
  let best = null;
  for(let a=0; a<onsets.length; a++){
    for(let b=a+1; b<onsets.length; b++){
      const r = matchesForInterval(onsets[a].pos, onsets[b].pos,
                                   activePattern, selectedKey);
      if(r.map.get(scaleTarget) === scaleRoot &&
         (best===null || r.steps < best.steps)){
        best = {A:onsets[a].pos, B:onsets[b].pos, steps:r.steps};
      }
    }
  }
  if(best){
    intervalSel = [best.A, best.B];
    recomputeMatches();
  }
}

function onPatternBtn(p){
  if(mode==="interval"){
    // only highlighted (matched) buttons are pressable in interval mode;
    // pressing one keeps the interval and moves pattern AND key to the match
    if(!matchInfo.has(p)) return;
    selectedKey = matchInfo.get(p);
    activePattern = p;
    recomputeMatches();
    render();
    return;
  }
  if(mode==="scale"){
    scaleTarget = p;
    tryScaleSelect();
    render();
    return;
  }
  // key / no mode
  activePattern = p;
  intervalSel = []; matchInfo = new Map(); currentSteps = null;
  render();
}

/* --------------------------------------------------------------- buttons */
const patWrap = document.getElementById("patBtns");
PATTERN_KEYS.forEach(p=>{
  const b=document.createElement("button");
  b.className="pat"; b.id="pat"+p; b.textContent=p;
  b.addEventListener("click",()=>onPatternBtn(p));
  patWrap.appendChild(b);
});
document.getElementById("mKey").addEventListener("click",()=>setMode("key"));
document.getElementById("mInterval").addEventListener("click",()=>setMode("interval"));
document.getElementById("mScale").addEventListener("click",()=>setMode("scale"));
document.getElementById("clearBtn").addEventListener("click",()=>{
  intervalSel=[]; scaleRoot=null; scaleTarget=null;
  matchInfo=new Map(); currentSteps=null; render();
});

function updateButtons(){
  document.getElementById("mKey").classList.toggle("active", mode==="key");
  document.getElementById("mInterval").classList.toggle("active", mode==="interval");
  document.getElementById("mScale").classList.toggle("active", mode==="scale");
  PATTERN_KEYS.forEach(p=>{
    const b=document.getElementById("pat"+p);
    b.classList.toggle("active", p===activePattern);
    b.classList.toggle("match", matchInfo.has(p));
    // in interval mode only highlighted (matched) buttons can be pressed
    b.disabled = mode==="interval" && !matchInfo.has(p);
  });
}

function updateInfo(){
  const info=document.getElementById("info");
  let h="";
  const modeName={key:"Change Key",interval:"Interval Mode",scale:"Scale Mode"}[mode]||"none";
  h+=`Mode: <b>${modeName}</b><br>`;
  h+=`Selected key (center): <b>${selectedKey}</b>`;
  h+=` &nbsp; Active pattern: <b>${activePattern??"none"}</b><br>`;

  if(mode==="interval"){
    if(activePattern==null){ h+="Pick a pattern, then click two onsets."; }
    else if(intervalSel.length<2){
      h+=`Click two onsets to draw an interval. (${intervalSel.length}/2 selected)`;
    } else {
      h+=`Interval ${intervalSel[0]}–${intervalSel[1]}: `;
      h+=`step <b>${currentSteps}</b> of its interval size.<br>`;
      h+= matchInfo.size
        ? "Matches: "+[...matchInfo].map(([p,c])=>`<span class="tag">${p} @ key ${c}</span>`).join("")
          +"<br><span style='color:var(--muted)'>Click a highlighted pattern button to switch (interval is kept; key follows).</span>"
        : "<span style='color:var(--muted)'>No other pattern creates this interval in the same number of steps.</span>";
    }
  } else if(mode==="scale"){
    h+=`Target center: <b>${scaleRoot??"—"}</b> &nbsp; Target pattern: <b>${scaleTarget??"—"}</b><br>`;
    if(scaleRoot!=null && scaleTarget!=null){
      h+= intervalSel.length===2
        ? `Interval ${intervalSel[0]}–${intervalSel[1]} leads to pattern <b>${scaleTarget}</b> centered at <b>${scaleRoot}</b>.`
        : "<span style='color:var(--muted)'>No interval in the active pattern leads to that pattern at that center.</span>";
    } else {
      h+="<span style='color:var(--muted)'>Pick a bold note (target center) and a pattern button.</span>";
    }
  } else if(mode==="key"){
    h+="<span style='color:var(--muted)'>Click a bold note to move the center of symmetry.</span>";
  } else {
    h+="<span style='color:var(--muted)'>Select a mode above.</span>";
  }
  info.innerHTML=h;
}

render();
</script>
</body>
</html>
